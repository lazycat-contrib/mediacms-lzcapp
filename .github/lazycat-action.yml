version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: mediacms
build:
  toolchains: []
  run_buildscript: false
images:
  - id: mediacms
    target: service
    service: mediacms
    source: mediacms/mediacms
    channel: stable
    sort: semver
    tag_regex: ^v?[0-9]+[.][0-9]+[.][0-9]+$
    delivery:
      mode: mirror
      require_digest_match: true
  - id: postgres
    target: service
    service: mediacms-db
    source: library/postgres
    channel: custom
    sort: semver
    tag_regex: ^1[67][.][0-9]+$
    version_regex: ^(?P<version>1[67][.][0-9]+)$
    version_template: "{version}.0"
    delivery:
      mode: mirror
      require_digest_match: true
  - id: redis
    target: service
    service: mediacms-redis
    source: library/redis
    channel: stable
    sort: semver
    tag_regex: ^[0-9]+[.][0-9]+[.][0-9]+$
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: MediaCMS
    skip_if_version_exists: true
